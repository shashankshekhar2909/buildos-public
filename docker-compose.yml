services:
  backend:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-buildos}-backend
    ports:
      - "${BACKEND_PORT:-8012}:8000"
    environment:
      - BUILDOS_DATA_DIR=${BUILDOS_DATA_DIR:-/app/data}
      - PROJECTS_ROOT=${PROJECTS_ROOT:-/app/projects}
      - PROJECTS_DISCOVERY_ROOTS=${PROJECTS_DISCOVERY_ROOTS:-/app/projects}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/buildos.db}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@local}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-change-me}
      - SEED_PROFILE=${SEED_PROFILE:-generic}
      - BUILDOS_GITHUB_URL=${BUILDOS_GITHUB_URL:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_MODE=${AUTH_MODE:-local}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-me-local-jwt-secret}
      - AUTH_JWT_ALGORITHM=${AUTH_JWT_ALGORITHM:-HS256}
      - AUTH_TOKEN_TTL_SECONDS=${AUTH_TOKEN_TTL_SECONDS:-43200}
      - STRICT_STARTUP_VALIDATION=${STRICT_STARTUP_VALIDATION:-true}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-}
      - AUTH0_ISSUER=${AUTH0_ISSUER:-}
      - PROJECT_FINDER_ALLOW_ANY_ROOT=${PROJECT_FINDER_ALLOW_ANY_ROOT:-false}
      - PROJECT_ALLOWED_ROOT_PREFIXES=${PROJECT_ALLOWED_ROOT_PREFIXES:-/app/projects,/home/shashank}
    volumes:
      - ./data:/app/data
      - ./projects:/app/projects
      - /home/shashank:/home/shashank:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-buildos}-frontend
    ports:
      - "${FRONTEND_PORT:-4211}:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
      - NEXT_PUBLIC_API_PORT=${NEXT_PUBLIC_API_PORT:-8012}
      - NEXT_PUBLIC_AUTH_MODE=${NEXT_PUBLIC_AUTH_MODE:-local}
      - BUILDOS_BACKEND_URL=http://backend:8000
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:4211}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID:-}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET:-}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-}
      - AUTH0_SCOPE=${AUTH0_SCOPE:-openid profile email}
    depends_on:
      - backend
    restart: unless-stopped
